<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Personal Finance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F3F0E6;--card:#FFFFFF;--ink:#20241F;--soft:#6B685C;--line:#E6E0CC;--line-2:#D5CEB4;--field:#F7F4EA;
  --green:#1F6F54;--green-soft:#E1EEE7;--rust:#A2402D;--rust-soft:#F6E2DB;--gold:#B4802A;--gold-soft:#F7ECD3;
  --hero:#20241F;--hero-ink:#F3F0E6;--ok:#5CC49A;--warn:#E2B04A;--bad:#E5806B;
  --shadow:0 1px 2px rgba(32,36,31,.05),0 6px 20px rgba(32,36,31,.06);
  --r:16px;--r-sm:10px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#131611;--card:#1C201A;--ink:#EEEBDD;--soft:#A29E8E;--line:#2B3029;--line-2:#3A4038;--field:#161915;
    --green:#4DB58C;--green-soft:#1E3128;--rust:#E58A74;--rust-soft:#3A2521;--gold:#D8A24A;--gold-soft:#372E19;
    --hero:#252A23;--hero-ink:#EEEBDD;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
}
*{box-sizing:border-box;}
.cum-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--hero);color:var(--hero-ink);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
.cum-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.cum-main{display:flex;flex-direction:column;min-width:0;}
.cum-lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.7;}
.cum-val{font-family:'Newsreader',serif;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.cum-val.pos{color:var(--ok);} .cum-val.neg{color:var(--bad);}
.cum-range{font-size:11px;opacity:.6;margin-top:1px;}
.cum-side{display:flex;gap:18px;}
.cum-side div{display:flex;flex-direction:column;align-items:flex-end;}
.cum-side span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;}
.cum-side b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
@media(max-width:480px){.cum-val{font-size:22px;}.cum-side{gap:12px;}.cum-side b{font-size:12.5px;}}

html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:24px 16px 120px;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;}
button{font-family:inherit;}

header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:'Newsreader',serif;font-weight:600;font-size:18px;flex:none;}
.brand h1{font-family:'Newsreader',serif;font-size:22px;font-weight:600;margin:0;line-height:1.15;}
.brand p{margin:2px 0 0;font-size:12px;color:var(--soft);}
.month-nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:var(--shadow);}
.month-nav>button{width:34px;height:34px;border-radius:50%;border:none;background:var(--field);color:var(--ink);font-size:18px;cursor:pointer;line-height:1;transition:background .15s,transform .1s;}
.month-nav>button:hover{background:var(--line);}
.month-nav>button:active{transform:scale(.92);}
.month-mid{display:flex;flex-direction:column;align-items:center;min-width:132px;}
.month-label{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.month-sub{min-height:16px;display:flex;align-items:center;}
.tag{font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;}
.today{background:none;border:none;padding:0;font-size:11px;font-weight:600;color:var(--gold);cursor:pointer;}

.install-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r-sm);font-size:12.5px;}
.install-bar.hidden{display:none;}
.install-bar button,.banner button,.addbtn,.form-actions .save,.new-cat button{display:flex;align-items:center;gap:6px;flex:none;background:var(--ink);color:var(--bg);border:none;border-radius:var(--r-sm);padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.install-bar button:hover,.banner button:hover,.addbtn:hover,.form-actions .save:hover,.new-cat button:hover{opacity:.85;}
.install-bar svg{width:14px;height:14px;}
.install-hint{display:none;margin:-4px 0 14px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);font-size:12.5px;color:var(--soft);line-height:1.55;animation:slideDown .25s ease;}
.install-hint.show{display:block;}
.install-hint b{color:var(--ink);}
.banner{display:none;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:14px;font-size:13.5px;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;animation:slideDown .35s ease;}
.banner.show{display:flex;}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:translateY(0);}}

#content{transition:opacity .18s ease;}
#content.fading{opacity:0;}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:22px 22px 20px;box-shadow:var(--shadow);margin-bottom:14px;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.figure .label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:6px;}
.figure .num{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;display:inline-block;line-height:1.05;}
.hero .pos{color:#6FD0A8;}
.hero .neg{color:#F0937E;}
.pos{color:var(--green);}
.neg{color:var(--rust);}
.export-buttons{display:flex;gap:6px;flex-wrap:wrap;}
.export-buttons button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);color:var(--hero-ink);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-sm);padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;}
.export-buttons button:hover{background:rgba(255,255,255,.2);}
.export-buttons svg{width:14px;height:14px;flex:none;}
.ratio{margin-top:18px;}
.ratio-top{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:7px;font-weight:500;}
.ratio-track{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;}
.ratio-fill{height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.3,1),background .3s;}

.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.chip{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);}
.chip .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;font-weight:700;flex:none;}
.chip.in .ico{background:var(--green-soft);color:var(--green);}
.chip.out .ico{background:var(--rust-soft);color:var(--rust);}
.chip .k{font-size:11.5px;color:var(--soft);font-weight:600;margin-bottom:3px;}
.chip .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}

.income-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.income-strip label{font-size:12.5px;font-weight:600;color:var(--soft);white-space:nowrap;}
.income-strip input{width:150px;padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-family:inherit;font-size:14px;font-weight:600;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums;}
.income-strip input:focus{outline:none;border-color:var(--ink);}
.income-strip .ccy-tag{font-size:12px;color:var(--soft);margin-inline-start:-4px;}
.income-strip .hint{font-size:11.5px;color:var(--soft);font-style:italic;}

section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
h2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);}
h2 .count{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:99px;background:var(--field);border:1px solid var(--line);font-size:11px;letter-spacing:0;}
.addbtn{text-transform:none;letter-spacing:0;}

.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;}
.cat-row:last-child{margin-bottom:0;}
.cat-name{width:150px;flex:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-track{flex:1;height:8px;background:var(--field);border-radius:99px;overflow:hidden;}
.cat-fill{display:block;height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.3,1);}
.cat-amt{width:96px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;line-height:1.25;}
.cat-amt i{display:block;font-style:normal;font-weight:500;font-size:11px;color:var(--soft);}
.empty{color:var(--soft);font-size:13.5px;padding:6px 2px;font-style:italic;}

.form-panel{max-height:0;overflow:hidden;background:var(--field);border:1px solid transparent;border-radius:var(--r-sm);transition:max-height .3s ease,margin .3s ease,border-color .1s;}
.form-panel.show{max-height:640px;margin-bottom:14px;border-color:var(--line);}
.form-panel-inner{padding:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.field label{display:block;font-size:11px;color:var(--soft);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.field input,.field select,.new-cat input{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-family:inherit;font-size:14px;background:var(--card);color:var(--ink);}
.field input:focus,.field select:focus,.new-cat input:focus{outline:none;border-color:var(--ink);}
.type-toggle{display:flex;gap:6px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;}
.type-toggle button{flex:1;padding:8px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--soft);cursor:pointer;transition:background .15s,color .15s;}
.type-toggle button.active[data-type="income"]{background:var(--green-soft);color:var(--green);}
.type-toggle button.active[data-type="expense"]{background:var(--rust-soft);color:var(--rust);}
.new-cat{display:none;gap:8px;margin:-2px 0 12px;}
.new-cat.show{display:flex;}
.custom-cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
.custom-cats:empty{display:none;}
.cchip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:99px;background:var(--gold-soft);border:1px solid var(--gold);font-size:12px;font-weight:600;}
.cchip button{border:none;background:none;color:var(--soft);cursor:pointer;font-size:15px;line-height:1;padding:0 6px;}
.cchip button:hover{color:var(--rust);}
.form-actions{display:flex;gap:8px;justify-content:flex-end;}
.form-actions .save{padding:9px 16px;font-size:13px;}
.form-actions .cancel{background:none;color:var(--soft);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 16px;font-size:13px;cursor:pointer;}

.txn{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);animation:fadeIn .3s ease;}
.txn:last-child{border-bottom:none;}
.txn .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;}
.txn .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.txn .cat{font-size:13.5px;font-weight:600;}
.txn .sub{font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn .amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;flex:none;}
.txn .del{background:none;border:none;color:var(--soft);cursor:pointer;font-size:14px;flex:none;padding:4px 6px;transition:color .15s;}
.txn .del:hover{color:var(--rust);}

.arch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.arch-row:last-child{border-bottom:none;}
.arch-row .m{font-weight:600;}
.arch-row .stats{color:var(--soft);font-size:12.5px;font-variant-numeric:tabular-nums;}
.arch-row .actions{display:flex;gap:6px;}
.arch-row .actions button{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:11.5px;color:var(--ink);font-weight:600;transition:border-color .15s;}
.arch-row .actions button:hover{border-color:var(--ink);}

@media(max-width:520px){
  body{padding:18px 12px 80px;}
  .figure .num{font-size:36px;}
  .cat-name{width:112px;font-size:12.5px;}
  .cat-amt{width:84px;}
  .chip .v{font-size:16px;}
  .month-mid{min-width:112px;}
  .form-grid{grid-template-columns:1fr;}
}
  #report{position:fixed;top:-10000px;left:-10000px;width:680px;background:#fff;color:#1a1a1a;padding:36px;font-family:'Inter',sans-serif;}
  #report h3{font-family:'Newsreader',serif;font-size:22px;margin:0 0 4px;font-weight:600;}
  #report .sub{color:#666;font-size:13px;margin-bottom:22px;}
  #report table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #report th,#report td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:left;}
  #report th{color:#555;font-weight:700;border-bottom:2px solid #222;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  #report td:last-child, #report th:last-child{text-align:right;}
  #report .sum-row td{border-top:2px solid #222;font-weight:700;border-bottom:none;padding-top:12px;}
  #report{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">PF</div>
      <div>
        <h1>Personal Finance Ledger</h1>
        <p>Your money, month by month</p>
      </div>
    </div>
    <div class="month-nav">
      <button id="prevM" title="Previous month">‹</button>
      <div class="month-mid">
        <span class="month-label" id="monthLabel">—</span>
        <span class="month-sub" id="monthSub"></span>
      </div>
      <button id="nextM" title="Next month">›</button>
    </div>
  </header>

  <div class="banner" id="banner">
    <span id="bannerText"></span>
    <button id="bannerBtn">Export that month</button>
  </div>

  <div class="install-bar" id="installBar">
    <span>Install it on your phone or computer.</span>
    <button id="installBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v13m0 0l-5-5m5 5l5-5"/><path d="M4 19h16"/></svg>
      Add to device
    </button>
  </div>
  <div class="install-hint" id="installHint"></div>

  <div id="content">

    <div class="hero">
      <div class="hero-top">
        <div class="figure">
          <span class="label">Net balance this month</span>
          <span class="num" id="netFigure">0</span>
        </div>
        <div class="export-buttons">
          <button id="expExcel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M8 8l8 8M16 8l-8 8"/></svg>
            Excel
          </button>
          <button id="expPdf">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>
            PDF
          </button>
          <button id="expYear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Full year
          </button>
          <button id="bkSave" title="Download a backup file of all your data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
            Backup
          </button>
          <button id="bkLoad" title="Restore your data from a backup file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>
            Restore
          </button>
          <input type="file" id="bkFile" accept=".json,application/json" style="display:none">
        </div>
      </div>
      <div class="ratio">
        <div class="ratio-top"><span>Spent vs income</span><b id="ratioText">—</b></div>
        <div class="ratio-track"><div class="ratio-fill" id="ratioFill"></div></div>
      </div>
    </div>

    <div class="chips">
      <div class="chip in"><div class="ico">↓</div><div><div class="k">Total income</div><div class="v pos" id="totalIn">0</div></div></div>
      <div class="chip out"><div class="ico">↑</div><div><div class="k">Total spent</div><div class="v neg" id="totalOut">0</div></div></div>
    </div>

    <div class="income-strip">
      <label for="monthlyIncomeInput">Monthly income (fixed)</label>
      <input type="number" id="monthlyIncomeInput" min="0" step="0.01" placeholder="e.g. 20000">
      <span class="ccy-tag">EGP</span>
      <span class="hint" id="incomeHint"></span>
    </div>

    <section>
      <h2><span>Spending by category</span></h2>
      <div id="expenseCats"></div>
    </section>

    <section>
      <h2><span>Income by source</span></h2>
      <div id="incomeCats"></div>
    </section>

    <section>
      <h2><span>Transactions<span class="count" id="txnCount">0</span></span><button class="addbtn" id="addBtn">＋ Add</button></h2>

      <div class="form-panel" id="formPanel">
        <div class="form-panel-inner">
          <div class="type-toggle">
            <button type="button" data-type="expense" class="active">Expense</button>
            <button type="button" data-type="income">Income</button>
          </div>
          <div class="form-grid">
            <div class="field">
              <label>Amount</label>
              <input type="number" id="fAmount" placeholder="0" min="0" step="0.01" inputmode="decimal">
            </div>
            <div class="field">
              <label>Category</label>
              <select id="fCategory"></select>
            </div>
            <div class="field">
              <label>Date</label>
              <input type="date" id="fDate">
            </div>
            <div class="field">
              <label>Note (optional)</label>
              <input type="text" id="fNote" placeholder="Details">
            </div>
          </div>
          <div class="new-cat" id="newCatRow">
            <input type="text" id="fNewCat" maxlength="28" placeholder="New category name">
            <button type="button" id="addCatBtn">Add</button>
          </div>
          <div class="custom-cats" id="customCats"></div>
          <div class="form-actions">
            <button class="cancel" id="cancelForm">Cancel</button>
            <button class="save" id="saveForm">Save transaction</button>
          </div>
        </div>
      </div>

      <div id="txnList"></div>
    </section>

    <section>
      <h2><span>Monthly archive</span></h2>
      <div id="archiveList"></div>
    </section>

  </div>

</div>

<div id="report"></div>

<div class="cum-bar" id="cumBar" aria-live="polite">
  <div class="cum-in">
    <div class="cum-main">
      <span class="cum-lbl">Cumulative balance</span>
      <span class="cum-val" id="cumVal">0 EGP</span>
      <span class="cum-range" id="cumRange"></span>
    </div>
    <div class="cum-side">
      <div><span>Total in</span><b id="cumIn">0</b></div>
      <div><span>Total out</span><b id="cumOut">0</b></div>
    </div>
  </div>
</div>

<script>
(function(){
  const DEFAULT_CATS = {
    expense:["Fuel","Transport","Food & drinks","Bills","Rent","Shopping","Health","Education","Entertainment","Gifts","Gameya (savings circle)"],
    income:["Salary","Freelance / side income","Gameya (savings circle)"]
  };
  const NEW_CAT = "__new__";
  const ICONS = {"Fuel":"⛽","Transport":"🚌","Food & drinks":"🍽️","Bills":"🧾","Rent":"🏠","Shopping":"🛍️","Health":"💊","Education":"📚","Entertainment":"🎬","Gifts":"🎁","Gameya (savings circle)":"🤝","Salary":"💼","Freelance / side income":"💻","Monthly income":"💼","Other":"📦"};
  const COLORS = {"Fuel":"#B4802A","Transport":"#2F6F8F","Food & drinks":"#C2603A","Bills":"#6B5B95","Rent":"#7A4E3A","Shopping":"#B04A7A","Health":"#3E8E7E","Education":"#4A6FB0","Entertainment":"#8E5FB5","Gifts":"#D0708A","Gameya (savings circle)":"#5C7F3A","Salary":"#1F6F54","Freelance / side income":"#2E8B6F","Monthly income":"#1F6F54","Other":"#7D7767"};
  const EXTRA_COLORS = ["#3F7CAC","#A0522D","#6A994E","#9C6644","#5F6CAF","#BC4B51","#2A9D8F","#8E6BBF"];
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function iconFor(c){ return ICONS[c] || "🏷️"; }
  function colorFor(c){
    if(COLORS[c]) return COLORS[c];
    let h = 0;
    for(let i=0;i<c.length;i++) h = (h*31 + c.charCodeAt(i)) >>> 0;
    return EXTRA_COLORS[h % EXTRA_COLORS.length];
  }
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const STORE_KEY = "finance_data_en_v1";
  const CCY = "EGP";

  let data = null;
  let viewingMonth = monthKey(new Date());
  let currentType = "expense";
  let lastNetValue = 0;

  function shortMonthLabel(mk){ const [y,m]=mk.split("-").map(Number); return MONTHS[m-1].slice(0,3)+"-"+y; }
  function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmt(n){ return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}); }
  function monthLabelText(mk){ const [y,m]=mk.split("-").map(Number); return MONTHS[m-1]+" "+y; }
  function shiftMonth(mk, delta){ let [y,m]=mk.split("-").map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return y+"-"+String(m).padStart(2,"0"); }

  async function loadData(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(!d.monthlyIncome) d.monthlyIncome = {};
        if(!d.customCategories) d.customCategories = {};
        if(!d.customCategories.expense) d.customCategories.expense = [];
        if(!d.customCategories.income) d.customCategories.income = [];
        return d;
      }
    }catch(e){ /* storage unavailable or empty */ }
    return { transactions: [], archivedMonths: {}, monthlyIncome: {}, customCategories: {expense:[], income:[]}, lastSeenMonth: monthKey(new Date()) };
  }
  async function saveData(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
    catch(e){ console.error("Could not save", e); }
  }

  async function saveFile(filename, blob){
    try{
      if(window.claude && typeof window.claude.use === "function"){
        const downloads = await window.claude.use("downloads");
        if(downloads){ await downloads.save({ filename, data: blob }); return; }
      }
    }catch(e){ /* fall through to a normal browser download */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function txnsForMonth(mk){ return data.transactions.filter(t => t.date.startsWith(mk)); }
  function totals(list){
    let inc=0, exp=0;
    list.forEach(t => t.type==="income" ? inc+=t.amount : exp+=t.amount);
    return {inc, exp, net: inc-exp};
  }
  function byCategory(list, type){
    const map = {};
    list.filter(t=>t.type===type).forEach(t=>{ map[t.category]=(map[t.category]||0)+t.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }

  function effectiveMonthlyIncome(mk){
    if(data.monthlyIncome && data.monthlyIncome[mk] != null){
      return { value: data.monthlyIncome[mk], inherited:false, sourceMonth: mk };
    }
    let m = mk;
    for(let i=0;i<36;i++){
      m = shiftMonth(m,-1);
      if(data.monthlyIncome && data.monthlyIncome[m] != null){
        return { value: data.monthlyIncome[m], inherited:true, sourceMonth: m };
      }
    }
    return { value:0, inherited:false, sourceMonth:null };
  }

  function monthTotals(mk){
    const list = txnsForMonth(mk);
    const base = totals(list);
    const income = effectiveMonthlyIncome(mk);
    return {
      list,
      txInc: base.inc, exp: base.exp,
      inc: base.inc + income.value,
      net: base.inc + income.value - base.exp,
      incomeVal: income.value, inherited: income.inherited, sourceMonth: income.sourceMonth
    };
  }

  function updateCumulative(){
    const keys = [];
    data.transactions.forEach(t=> keys.push(t.date.slice(0,7)));
    Object.keys(data.monthlyIncome||{}).forEach(k=> keys.push(k));
    const valEl = document.getElementById("cumVal");
    if(!keys.length){
      valEl.textContent = "0 "+CCY; valEl.className = "cum-val";
      document.getElementById("cumIn").textContent = "0";
      document.getElementById("cumOut").textContent = "0";
      document.getElementById("cumRange").textContent = "No data yet";
      return;
    }
    keys.sort();
    const first = keys[0];
    let m = first, inc = 0, exp = 0, guard = 0;
    while(m <= viewingMonth && guard++ < 1200){
      const mt = monthTotals(m);
      inc += mt.inc; exp += mt.exp;
      m = shiftMonth(m, 1);
    }
    const net = inc - exp;
    valEl.textContent = (net>=0?"+":"-") + fmt(Math.abs(net)) + " " + CCY;
    valEl.className = "cum-val " + (net>=0 ? "pos" : "neg");
    document.getElementById("cumIn").textContent = fmt(inc);
    document.getElementById("cumOut").textContent = fmt(exp);
    document.getElementById("cumRange").textContent = first > viewingMonth
      ? "Nothing recorded up to " + shortMonthLabel(viewingMonth)
      : shortMonthLabel(first) + " → " + shortMonthLabel(viewingMonth);
  }

  function checkRollover(){
    const nowKey = monthKey(new Date());
    if(data.lastSeenMonth !== nowKey){
      let m = data.lastSeenMonth;
      while(m && m < nowKey){
        if(txnsForMonth(m).length || (data.monthlyIncome && data.monthlyIncome[m] != null)){ data.archivedMonths[m] = true; }
        m = shiftMonth(m, 1);
      }
      data.lastSeenMonth = nowKey;
      saveData();
      const closedKey = shiftMonth(nowKey,-1);
      const closedList = txnsForMonth(closedKey);
      const closedHasIncome = data.monthlyIncome && data.monthlyIncome[closedKey] != null;
      if(closedList.length || closedHasIncome){
        document.getElementById("bannerText").innerHTML =
          "We closed <strong>"+monthLabelText(closedKey)+"</strong> automatically and archived it — you can export it now.";
        document.getElementById("banner").classList.add("show");
        document.getElementById("bannerBtn").onclick = ()=> exportExcel(closedKey);
      }
    }
  }

  function categoryList(type){
    const custom = (data.customCategories && data.customCategories[type]) || [];
    const base = DEFAULT_CATS[type];
    return base.concat(custom.filter(c=>!base.includes(c) && c!=="Other"), ["Other"]);
  }
  function renderCustomChips(){
    const el = document.getElementById("customCats");
    const list = data.customCategories[currentType] || [];
    el.innerHTML = list.map(c=>`<span class="cchip">${esc(c)}<button type="button" data-rm="${esc(c)}" title="Remove">×</button></span>`).join("");
    el.querySelectorAll("[data-rm]").forEach(b=>{
      b.onclick = ()=>{
        data.customCategories[currentType] = data.customCategories[currentType].filter(x=>x!==b.dataset.rm);
        saveData();
        populateCategorySelect(document.getElementById("fCategory").value);
      };
    });
  }
  function populateCategorySelect(selected){
    const sel = document.getElementById("fCategory");
    const list = categoryList(currentType);
    sel.innerHTML = list.map(c=>`<option value="${esc(c)}">${iconFor(c)}  ${esc(c)}</option>`).join("") + `<option value="${NEW_CAT}">＋ New category…</option>`;
    sel.value = list.includes(selected) ? selected : list[0];
    document.getElementById("newCatRow").classList.remove("show");
    renderCustomChips();
  }
  function addCustomCategory(){
    const inp = document.getElementById("fNewCat");
    const name = inp.value.trim().replace(/\s+/g, " ");
    if(!name || name === NEW_CAT){ inp.focus(); return; }
    const existing = categoryList(currentType).find(c=>c.toLowerCase()===name.toLowerCase());
    if(!existing){ data.customCategories[currentType].push(name); saveData(); }
    inp.value = "";
    populateCategorySelect(existing || name);
  }

  function animateNumber(el, from, to, prefix, suffix, cls){
    const dur = 500, start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      const val = from + (to-from)*eased;
      el.textContent = prefix + fmt(val) + suffix;
      if(p<1) requestAnimationFrame(step); else el.textContent = prefix + fmt(to) + suffix;
    }
    el.className = "num " + cls;
    requestAnimationFrame(step);
  }

  function renderMonthSub(){
    const el = document.getElementById("monthSub");
    if(viewingMonth === monthKey(new Date())){ el.innerHTML = `<span class="tag">This month</span>`; return; }
    el.innerHTML = `<button type="button" class="today" id="todayBtn">↺ Back to this month</button>`;
    document.getElementById("todayBtn").onclick = ()=>{ viewingMonth = monthKey(new Date()); render(true); };
  }

  function renderRatio(inc, exp){
    const fill = document.getElementById("ratioFill"), txt = document.getElementById("ratioText");
    if(inc <= 0){ txt.textContent = exp>0 ? "No income set" : "—"; fill.style.width = "0%"; return; }
    const p = exp/inc*100;
    txt.textContent = Math.round(p)+"%";
    fill.style.width = Math.min(100,p)+"%";
    fill.style.background = p<60 ? "var(--ok)" : p<85 ? "var(--warn)" : "var(--bad)";
  }

  function render(withTransition){
    const content = document.getElementById("content");
    const doRender = ()=>{
      document.getElementById("monthLabel").textContent = monthLabelText(viewingMonth);
      renderMonthSub();
      syncFormDate(false);
      refreshIncomeField();

      const mt = monthTotals(viewingMonth);
      const list = mt.list.slice().sort((a,b)=> b.date.localeCompare(a.date));
      const { inc, exp, net } = mt;

      const netEl = document.getElementById("netFigure");
      animateNumber(netEl, lastNetValue, net, net>=0 ? "+" : "-", " "+CCY, net>=0?"pos":"neg");
      lastNetValue = net;

      document.getElementById("totalIn").textContent = fmt(inc)+" "+CCY;
      document.getElementById("totalOut").textContent = fmt(exp)+" "+CCY;
      renderRatio(inc, exp);
      document.getElementById("txnCount").textContent = list.length;

      const incomeEntries = byCategory(list,"income");
      if(mt.incomeVal > 0) incomeEntries.unshift(["Monthly income", mt.incomeVal]);

      renderCatBlock("expenseCats", byCategory(list,"expense"), "expense");
      renderCatBlock("incomeCats", incomeEntries, "income");

      const txnListEl = document.getElementById("txnList");
      if(!list.length){
        txnListEl.innerHTML = `<div class="empty">No transactions logged for this month yet.</div>`;
      } else {
        txnListEl.innerHTML = list.map(t=>{
          const d = t.date.slice(8,10)+" "+MONTHS[+t.date.slice(5,7)-1].slice(0,3);
          return `
          <div class="txn">
            <span class="ico" style="background:${colorFor(t.category)}22">${iconFor(t.category)}</span>
            <span class="info">
              <span class="cat">${esc(t.category)}</span>
              <span class="sub">${d}${t.note ? " · "+esc(t.note) : ""}</span>
            </span>
            <span class="amt ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</span>
            <button class="del" data-id="${t.id}" title="Delete">✕</button>
          </div>`;
        }).join("");
        txnListEl.querySelectorAll(".del").forEach(btn=>{
          btn.onclick = ()=>{
            data.transactions = data.transactions.filter(t=>t.id!==btn.dataset.id);
            saveData(); render(false);
          };
        });
      }
      renderArchive();
      updateCumulative();
    };

    if(withTransition){
      content.classList.add("fading");
      setTimeout(()=>{ doRender(); content.classList.remove("fading"); }, 160);
    } else {
      doRender();
    }
  }

  function renderCatBlock(elId, entries, type){
    const el = document.getElementById(elId);
    if(!entries.length){ el.innerHTML = `<div class="empty">Nothing here yet.</div>`; return; }
    const max = Math.max(...entries.map(e=>e[1]));
    const sum = entries.reduce((s,e)=>s+e[1],0);
    el.innerHTML = entries.map(([cat,amt])=>`
      <div class="cat-row">
        <span class="cat-name">${iconFor(cat)} ${esc(cat)}</span>
        <span class="cat-track"><span class="cat-fill" style="background:${colorFor(cat)}" data-w="${Math.max(4,(amt/max)*100)}"></span></span>
        <span class="cat-amt">${fmt(amt)} ${CCY}<i>${Math.round(amt/sum*100)}%</i></span>
      </div>`).join("");
    requestAnimationFrame(()=>{
      el.querySelectorAll(".cat-fill").forEach(f=>{ f.style.width = f.dataset.w+"%"; });
    });
  }

  function renderArchive(){
    const el = document.getElementById("archiveList");
    const months = Object.keys(data.archivedMonths).sort().reverse();
    if(!months.length){ el.innerHTML = `<div class="empty">Closed months will appear here automatically.</div>`; return; }
    el.innerHTML = months.map(mk=>{
      const t = monthTotals(mk);
      return `<div class="arch-row">
        <span class="m">${monthLabelText(mk)}</span>
        <span class="stats">net ${t.net>=0?'+':''}${fmt(t.net)} ${CCY}</span>
        <span class="actions">
          <button data-xl="${mk}">Excel</button>
          <button data-pd="${mk}">PDF</button>
        </span>
      </div>`;
    }).join("");
    el.querySelectorAll("[data-xl]").forEach(b=> b.onclick=()=>exportExcel(b.dataset.xl));
    el.querySelectorAll("[data-pd]").forEach(b=> b.onclick=()=>exportPdf(b.dataset.pd));
  }

  const incomeInput = document.getElementById("monthlyIncomeInput");
  function refreshIncomeField(){
    const { value, inherited, sourceMonth } = effectiveMonthlyIncome(viewingMonth);
    incomeInput.value = value > 0 ? value : "";
    document.getElementById("incomeHint").textContent =
      (inherited && value > 0) ? `carried over from ${monthLabelText(sourceMonth)} — edit to update` : "";
  }
  incomeInput.addEventListener("change", ()=>{
    const v = parseFloat(incomeInput.value);
    if(!data.monthlyIncome) data.monthlyIncome = {};
    if(isNaN(v) || v<=0){ delete data.monthlyIncome[viewingMonth]; }
    else { data.monthlyIncome[viewingMonth] = v; }
    saveData();
    render(false);
  });

  const formPanel = document.getElementById("formPanel");
  function defaultDate(){
    if(viewingMonth === monthKey(new Date())) return todayISO();
    const [y,m] = viewingMonth.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    return viewingMonth+"-"+String(Math.min(new Date().getDate(), last)).padStart(2,"0");
  }
  function syncFormDate(force){
    const f = document.getElementById("fDate");
    const [y,m] = viewingMonth.split("-").map(Number);
    const last = new Date(y, m, 0).getDate();
    f.min = viewingMonth+"-01";
    f.max = viewingMonth+"-"+String(last).padStart(2,"0");
    if(force || !f.value || f.value.slice(0,7) !== viewingMonth) f.value = defaultDate();
  }
  document.getElementById("addBtn").onclick = ()=>{
    const open = formPanel.classList.toggle("show");
    if(open){
      syncFormDate(true);
      populateCategorySelect();
      document.getElementById("fAmount").focus();
    }
  };
  document.getElementById("cancelForm").onclick = ()=> formPanel.classList.remove("show");
  document.querySelectorAll(".type-toggle button").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".type-toggle button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
      populateCategorySelect();
    };
  });
  document.getElementById("fCategory").onchange = e=>{
    const row = document.getElementById("newCatRow");
    if(e.target.value === NEW_CAT){ row.classList.add("show"); document.getElementById("fNewCat").focus(); }
    else row.classList.remove("show");
  };
  document.getElementById("addCatBtn").onclick = addCustomCategory;
  document.getElementById("fNewCat").addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); addCustomCategory(); }
  });
  document.getElementById("saveForm").onclick = ()=>{
    const amount = parseFloat(document.getElementById("fAmount").value);
    const category = document.getElementById("fCategory").value;
    const date = document.getElementById("fDate").value || todayISO();
    const note = document.getElementById("fNote").value.trim();
    if(!amount || amount<=0){ document.getElementById("fAmount").focus(); return; }
    if(category === NEW_CAT){ document.getElementById("fNewCat").focus(); return; }
    data.transactions.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), type: currentType, category, amount, date, note });
    saveData();
    document.getElementById("fAmount").value = "";
    document.getElementById("fNote").value = "";
    formPanel.classList.remove("show");
    viewingMonth = date.slice(0,7);
    render(true);
  };

  document.getElementById("prevM").onclick = ()=>{ viewingMonth = shiftMonth(viewingMonth,-1); render(true); };
  document.getElementById("nextM").onclick = ()=>{ viewingMonth = shiftMonth(viewingMonth, 1); render(true); };

  let lastNowKey = monthKey(new Date());
  function syncToToday(){
    const nk = monthKey(new Date());
    if(nk === lastNowKey) return;
    lastNowKey = nk;
    checkRollover();
    viewingMonth = nk;
    lastNetValue = 0;
    render(true);
  }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncToToday(); });
  window.addEventListener("focus", syncToToday);
  window.addEventListener("pageshow", syncToToday);
  setInterval(syncToToday, 60000);

  function setupManifest(){
    const icon = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">'+
      '<rect width="512" height="512" fill="#20241F"/>'+
      '<text x="50%" y="56%" font-family="Georgia,serif" font-size="230" fill="#FBF9F2" text-anchor="middle" dominant-baseline="middle">PF</text>'+
      '</svg>'
    );
    const manifest = {
      name: "Personal Finance Ledger",
      short_name: "Finance",
      start_url: location.href.split('#')[0].split('?')[0],
      display: "standalone",
      background_color: "#EAE5D6",
      theme_color: "#20241F",
      icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    if('serviceWorker' in navigator){
      try{
        const swUrl = URL.createObjectURL(new Blob(["self.addEventListener('fetch',function(){});"], {type:'text/javascript'}));
        navigator.serviceWorker.register(swUrl).catch(()=>{});
      }catch(e){}
    }
  }

  function detectPlatform(){
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);
    const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
    const isEdge = /Edg\//.test(ua);
    const isChrome = /Chrome\//.test(ua) && !isEdge;
    const isFirefox = /Firefox/.test(ua);
    const isMac = /Macintosh/.test(ua) && !isIOS;
    return {isIOS,isAndroid,isSafari,isEdge,isChrome,isFirefox,isMac};
  }
  function installInstructions(){
    const p = detectPlatform();
    if(p.isIOS) return "On iPhone/iPad: tap the <b>Share</b> icon in Safari, then choose <b>“Add to Home Screen”</b>.";
    if(p.isAndroid && p.isChrome) return "Tap the <b>⋮</b> menu in Chrome, then choose <b>“Install app”</b> (or “Add to Home screen”).";
    if(p.isAndroid) return "Open your browser's menu and choose <b>“Add to Home screen”</b>.";
    if(p.isChrome || p.isEdge) return "Click the <b>install icon</b> at the right of the address bar, or open the browser menu and choose <b>“Install Personal Finance Ledger”</b>.";
    if(p.isSafari && p.isMac) return "In Safari's menu bar, choose <b>File → Add to Dock</b>.";
    if(p.isFirefox) return "Firefox doesn't support app installs — use <b>Bookmark this page</b> (Ctrl/Cmd+D) instead, or keep the downloaded file and open it anytime.";
    return "Open your browser's menu and look for <b>“Install app”</b> or <b>“Add to Home screen”</b>.";
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener('appinstalled', ()=>{
    document.getElementById('installBar').classList.add('hidden');
  });
  if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
    document.getElementById('installBar').classList.add('hidden');
  }
  document.getElementById('installBtn').addEventListener('click', async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if(choice.outcome === 'accepted'){ document.getElementById('installBar').classList.add('hidden'); }
      return;
    }
    const hint = document.getElementById('installHint');
    hint.innerHTML = installInstructions();
    hint.classList.toggle('show');
  });
  setupManifest();

  const PAL = {
    ink:   {argb:'FF20241F', rgb:[32,36,31]},
    paper: {argb:'FFFBF9F2', rgb:[251,249,242]},
    line:  {argb:'FFC6BEA3', rgb:[198,190,163]},
    soft:  {argb:'FF666256', rgb:[102,98,86]},
    green: {argb:'FF1F6F54', rgb:[31,111,84]},
    rust:  {argb:'FFA2402D', rgb:[162,64,45]},
    stripe:{argb:'FFF3EFE1', rgb:[243,239,225]},
  };

  const CHART_NS = 'xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';

  function xesc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function sref(sheet, a1){ return xesc("'" + String(sheet).replace(/'/g,"''") + "'!" + a1); }
  function solid(hex){ return '<a:solidFill><a:srgbClr val="'+hex+'"/></a:solidFill>'; }
  function txPr(hex, size, bold){

  function cashFlowChartXml(sheet, opts){
    const { titleText, catRange, incomeRange, expenseRange, cumRange, incomeHead, expenseHead, cumHead, incomeName, expenseName, cumName, ccy } = opts;
    const INK='20241F', GREEN='1F6F54', RUST='A2402D', LINE='C6BEA3', GRID='E3DCC7';
    const cat = '<c:cat>'+strRefX(sref(sheet, catRange))+'</c:cat>';
    function barSer(idx, headRef, headName, valRange, color){
      return '<c:ser><c:idx val="'+idx+'"/><c:order val="'+idx+'"/>'+
        '<c:tx>'+strRefX(sref(sheet, headRef), headName)+'</c:tx>'+
        '<c:spPr>'+solid(color)+'<a:ln><a:noFill/></a:ln></c:spPr>'+
        cat+'<c:val><c:numRef><c:f>'+sref(sheet, valRange)+'</c:f></c:numRef></c:val></c:ser>';
    }
    const bars = '<c:barChart><c:barDir val="col"/><c:grouping val="stacked"/><c:varyColors val="0"/>'+
      barSer(0, incomeHead, incomeName, incomeRange, GREEN)+
      barSer(1, expenseHead, expenseName, expenseRange, RUST)+
      '<c:gapWidth val="60"/><c:overlap val="100"/><c:axId val="111111111"/><c:axId val="222222222"/></c:barChart>';
    const line = '<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>'+
      '<c:ser><c:idx val="2"/><c:order val="2"/><c:tx>'+strRefX(sref(sheet, cumHead), cumName)+'</c:tx>'+
      '<c:spPr><a:ln w="28575" cap="rnd">'+solid(INK)+'<a:round/></a:ln></c:spPr>'+
      '<c:marker><c:symbol val="diamond"/><c:size val="6"/><c:spPr>'+solid(INK)+'<a:ln w="9525">'+solid(INK)+'</a:ln></c:spPr></c:marker>'+
      cat+'<c:val><c:numRef><c:f>'+sref(sheet, cumRange)+'</c:f></c:numRef></c:val><c:smooth val="0"/></c:ser>'+
      '<c:marker val="1"/><c:axId val="333333333"/><c:axId val="444444444"/></c:lineChart>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<c:chartSpace '+CHART_NS+'><c:date1904 val="0"/><c:lang val="en-US"/><c:roundedCorners val="0"/><c:chart>'+
      chartTitle(titleText, INK)+
      '<c:plotArea><c:layout/>'+bars+line+
      catAxis('111111111','222222222',{title:'Month', color:INK, line:LINE, lblLow:true})+
      valAxis('222222222','111111111',{title:'Monthly flow ', color:INK, line:LINE, grid:true})+

      '<c:legend><c:legendPos val="b"/><c:overlay val="0"/>'+txPr(INK,900,false)+'</c:legend>'+
      '<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart>'+
      '<c:spPr>'+solid('FBF9F2')+'<a:ln w="9525">'+solid(LINE)+'</a:ln></c:spPr></c:chartSpace>';

      '<xdr:to><xdr:col>'+a.toCol+'</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>'+a.toRow+'</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>'+
      '<xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="2" name="Chart 1"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr>'+

  async function injectCharts(buffer, charts){
    const zip = await JSZip.loadAsync(buffer);
    const wbXml = await zip.file('xl/workbook.xml').async('string');
    const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');

    const sheetMap = {};
    wbXml.replace(/<sheet[^>]*\/>/g, (tag)=>{
      const name = (tag.match(/name="([^"]*)"/)||[])[1];
      const rid  = (tag.match(/r:id="([^"]*)"/)||[])[1];
      if(name && rid) sheetMap[name.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>')] = rid;
      return tag;
    });
    const relMap = {};
    relsXml.replace(/<Relationship[^>]*\/>/g, (tag)=>{
      const id = (tag.match(/Id="([^"]*)"/)||[])[1];
      const target = (tag.match(/Target="([^"]*)"/)||[])[1];
      if(id && target) relMap[id] = target.replace(/^\//,'').replace(/^xl\//,'');
      return tag;
    });

    let ctXml = await zip.file('[Content_Types].xml').async('string');
    let added = 0;

    for(const spec of charts){
      const rid = sheetMap[spec.sheet];
      if(!rid) continue;
      const sheetPath = 'xl/' + relMap[rid];
      const sheetFile = zip.file(sheetPath);
      if(!sheetFile) continue;
      added++;
      const n = added;

      zip.file('xl/charts/chart'+n+'.xml', spec.xml);
      zip.file('xl/drawings/drawing'+n+'.xml', drawingXml(spec.anchor, 'rId1'));
      zip.file('xl/drawings/_rels/drawing'+n+'.xml.rels',
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart'+n+'.xml"/></Relationships>');

      const sheetRelPath = sheetPath.replace(/([^/]+)$/, '_rels/$1.rels');
      let sheetRels = zip.file(sheetRelPath) ? await zip.file(sheetRelPath).async('string') : null;
      let drawingRelId;
      if(sheetRels){
        const ids = (sheetRels.match(/Id="rId(\d+)"/g)||[]).map(s=>parseInt(s.replace(/\D/g,''),10));
        drawingRelId = 'rId' + ((ids.length?Math.max.apply(null, ids):0) + 1);
        sheetRels = sheetRels.replace('</Relationships>',
          '<Relationship Id="'+drawingRelId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing'+n+'.xml"/></Relationships>');
      } else {
        drawingRelId = 'rId1';
        sheetRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing'+n+'.xml"/></Relationships>';
      }
      zip.file(sheetRelPath, sheetRels);

      let sheetXml = await sheetFile.async('string');
      sheetXml = sheetXml.replace(/<drawing[^>]*\/>/g, '');
      const drawTag = '<drawing r:id="'+drawingRelId+'"/>';
      let at = -1;
      ['<legacyDrawing', '<tableParts', '<extLst'].forEach(tag=>{
        const i = sheetXml.indexOf(tag);
        if(i !== -1 && (at === -1 || i < at)) at = i;
      });
      if(at === -1) at = sheetXml.lastIndexOf('</worksheet>');
      sheetXml = sheetXml.slice(0, at) + drawTag + sheetXml.slice(at);
      zip.file(sheetPath, sheetXml);

      ctXml = ctXml.replace('</Types>',
        '<Override PartName="/xl/charts/chart'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>'+
        '<Override PartName="/xl/drawings/drawing'+n+'.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');
    }

    zip.file('[Content_Types].xml', ctXml);
    return await zip.generateAsync({type:'arraybuffer', compression:'DEFLATE'});
  }

  async function exportExcel(mk){
    const mt = monthTotals(mk);
    const list = mt.list.slice();
    if(mt.incomeVal > 0){
      list.push({date: mk+"-01", type:"income", category:"Monthly income", amount: mt.incomeVal,
        note: mt.inherited ? `carried from ${monthLabelText(mt.sourceMonth)}` : ""});
    }
    list.sort((a,b)=> a.date.localeCompare(b.date));
    const { inc, exp, net } = mt;

    const wb = new ExcelJS.Workbook();
    wb.creator = "Personal Finance Ledger";
    wb.created = new Date();
    const sheetName = monthLabelText(mk).replace(" ","-").slice(0,31);
    const ws = wb.addWorksheet(sheetName, {
      views: [{ state:'frozen', ySplit:4 }]
    });
    ws.columns = [{width:13},{width:11},{width:24},{width:15},{width:34}];

    ws.mergeCells('A1:E1');
    const title = ws.getCell('A1');
    title.value = `Personal Finance Ledger — ${monthLabelText(mk)}`;
    title.font = {bold:true, size:14, color:{argb:PAL.paper.argb}};
    title.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
    title.alignment = {vertical:'middle'};
    ws.getRow(1).height = 26;

    ws.mergeCells('A2:E2');
    const sub = ws.getCell('A2');
    sub.value = `Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}  ·  ${list.length} transaction${list.length===1?'':'s'}`;
    sub.font = {italic:true, size:10, color:{argb:PAL.soft.argb}};
    ws.getRow(2).height = 18;
    ws.getRow(3).height = 6;

    const head = ws.getRow(4);
    head.values = ['Date','Type','Category',`Amount (${CCY})`,'Note'];
    head.eachCell(c=>{
      c.font = {bold:true, color:{argb:PAL.paper.argb}};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
      c.alignment = {vertical:'middle'};
    });
    head.height = 20;
    ws.autoFilter = { from:'A4', to:'E4' };

    let r = 5;
    list.forEach((t,i)=>{
      const row = ws.getRow(r);
      row.values = [t.date, t.type==='income'?'Income':'Expense', t.category, t.amount, t.note||''];
      row.getCell(4).numFmt = '#,##0.00';
      const color = t.type==='income' ? PAL.green.argb : PAL.rust.argb;
      row.getCell(2).font = {bold:true, color:{argb:color}};
      row.getCell(4).font = {bold:true, color:{argb:color}};
      if(i%2===1){
        row.eachCell({includeEmpty:true}, c=>{ if(!c.fill || c.fill.fgColor?.argb!==PAL.stripe.argb){ c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.stripe.argb}}; } });
      }
      row.eachCell({includeEmpty:true}, c=>{ c.border = {bottom:{style:'hair', color:{argb:PAL.line.argb}}}; });
      r++;
    });
    if(!list.length){
      ws.mergeCells(`A${r}:E${r}`);
      ws.getCell(`A${r}`).value = 'No transactions recorded for this month.';
      ws.getCell(`A${r}`).font = {italic:true, color:{argb:PAL.soft.argb}};
      r++;
    }

    r++;
    function summaryRow(label, val, colorArgb){
      ws.mergeCells(`A${r}:C${r}`);
      const l = ws.getCell(`A${r}`); l.value = label; l.font = {bold:true, size:11};
      const v = ws.getCell(`D${r}`); v.value = val; v.numFmt = '#,##0.00';
      v.font = {bold:true, size:11, color:{argb:colorArgb}};
      ws.getRow(r).border = {top:{style:'thin', color:{argb:PAL.ink.argb}}};
      r++;
    }
    summaryRow('Total income', inc, PAL.green.argb);
    summaryRow('Total spent', exp, PAL.rust.argb);
    summaryRow('Net', net, net>=0?PAL.green.argb:PAL.rust.argb);

    const tally = {};
    list.forEach(t=>{ if(t.type!=='income'){ tally[t.category] = (tally[t.category]||0) + t.amount; } });
    const bd = Object.keys(tally).map(k=>[k, tally[k]]).sort((a,b)=> b[1]-a[1]).slice(0,12);
    let charts = [];
    if(bd.length){
      r += 2;
      const bdHead = r;
      ws.getCell(`A${r}`).value = 'Category';
      ws.getCell(`B${r}`).value = `Spent (${CCY})`;
      [`A${r}`,`B${r}`].forEach(addr=>{
        const c = ws.getCell(addr);
        c.font = {bold:true, color:{argb:PAL.paper.argb}};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
      });
      ws.getRow(r).height = 20;
      r++;
      const bdStart = r;
      bd.forEach(pair=>{
        ws.getCell(`A${r}`).value = pair[0];
        const v = ws.getCell(`B${r}`);
        v.value = pair[1];
        v.numFmt = '#,##0.00';
        v.font = {bold:true, color:{argb:PAL.rust.argb}};
        ws.getCell(`A${r}`).border = {bottom:{style:'hair', color:{argb:PAL.line.argb}}};
        v.border = {bottom:{style:'hair', color:{argb:PAL.line.argb}}};
        r++;
      });
      const bdEnd = r-1;
      charts.push({
        sheet: sheetName,
        xml: categoryChartXml(sheetName, {
          titleText: `Where the money went — ${monthLabelText(mk)}`,
          catRange: `$A$${bdStart}:$A$${bdEnd}`,
          valRange: `$B$${bdStart}:$B$${bdEnd}`,
          headRef: `$B$${bdHead}`,
          headName: `Spent (${CCY})`,
          ccy: CCY
        }),
        anchor: {fromCol:5, fromRow:bdHead-1, toCol:13, toRow:bdHead+Math.max(14, bd.length*2+6)}
      });
    }

    const buf = await wb.xlsx.writeBuffer();
    const bytes = charts.length ? await injectCharts(buf, charts) : buf;
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    await saveFile(`ledger-${mk}.xlsx`, blob);
  }

  async function exportPdf(mk){
    const mt = monthTotals(mk);
    const list = mt.list.slice();
    if(mt.incomeVal > 0){
      list.push({date: mk+"-01", type:"income", category:"Monthly income", amount: mt.incomeVal,
        note: mt.inherited ? `carried from ${monthLabelText(mt.sourceMonth)}` : ""});
    }
    list.sort((a,b)=> a.date.localeCompare(b.date));
    const { inc, exp, net } = mt;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 40;

    doc.setFillColor(...PAL.ink.rgb);
    doc.rect(0, 0, pageW, 64, 'F');
    doc.setTextColor(...PAL.paper.rgb);
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Personal Finance Ledger', margin, 29);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(monthLabelText(mk), margin, 47);
    doc.setFontSize(8.5);
    doc.text(`Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`, pageW-margin, 47, {align:'right'});

    const boxY = 84, boxH = 54, gap = 12;
    const boxW = (pageW - margin*2 - gap*2)/3;
    [
      {label:'Total income', val: inc, color: PAL.green.rgb, sign:'+'},
      {label:'Total spent', val: exp, color: PAL.rust.rgb, sign:'-'},
      {label:'Net', val: net, color: net>=0?PAL.green.rgb:PAL.rust.rgb, sign: net>=0?'+':'-'},
    ].forEach((b,i)=>{
      const x = margin + i*(boxW+gap);
      doc.setDrawColor(...PAL.line.rgb);
      doc.setFillColor(...PAL.paper.rgb);
      doc.roundedRect(x, boxY, boxW, boxH, 2, 2, 'FD');
      doc.setTextColor(...PAL.soft.rgb);
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.text(b.label.toUpperCase(), x+12, boxY+19);
      doc.setTextColor(...b.color);
      doc.setFont('helvetica','bold'); doc.setFontSize(15.5);
      doc.text(`${b.sign}${fmt(Math.abs(b.val))} ${CCY}`, x+12, boxY+39);
    });

    const tableTop = boxY + boxH + 22;

    if(!list.length){
      doc.setTextColor(...PAL.soft.rgb);
      doc.setFont('helvetica','italic'); doc.setFontSize(11);
      doc.text('No transactions recorded for this month.', margin, tableTop+10);
    } else {
      const body = list.map(t=>[
        t.date,
        t.type==='income'?'Income':'Expense',
        t.category,
        t.note||'',
        `${t.type==='income'?'+':'-'}${fmt(t.amount)} ${CCY}`
      ]);
      doc.autoTable({
        startY: tableTop,
        margin: {left:margin, right:margin, bottom:40},
        head: [['Date','Type','Category','Note','Amount']],
        body: body,
        styles: { font:'helvetica', fontSize:9, cellPadding:6, textColor:PAL.ink.rgb, lineColor:PAL.line.rgb, lineWidth:0.5, overflow:'ellipsize' },
        headStyles: { fillColor:PAL.ink.rgb, textColor:PAL.paper.rgb, fontStyle:'bold', fontSize:8.5 },
        alternateRowStyles: { fillColor:PAL.stripe.rgb },
        columnStyles: { 0:{cellWidth:56}, 1:{cellWidth:56}, 3:{cellWidth:'auto'}, 4:{halign:'right', cellWidth:82} },
        didParseCell: function(d){
          if(d.section==='body' && (d.column.index===1 || d.column.index===4)){
            const isIncome = d.row.raw[1] === 'Income';
            d.cell.styles.textColor = isIncome ? PAL.green.rgb : PAL.rust.rgb;
            if(d.column.index===4) d.cell.styles.fontStyle = 'bold';
          }
        },
        didDrawPage: function(){
          const h = doc.internal.pageSize.getHeight();
          doc.setFontSize(8);
          doc.setTextColor(...PAL.soft.rgb);
          doc.text('Personal Finance Ledger', margin, h-22);
          doc.text(`Page ${doc.internal.getCurrentPageInfo().pageNumber}`, pageW-margin, h-22, {align:'right'});
        }
      });
    }

    const blob = doc.output("blob");
    await saveFile(`ledger-${mk}.pdf`, blob);
  }

  async function exportAnnualExcel(year){
    const wb = new ExcelJS.Workbook();
    wb.creator = "Personal Finance Ledger";
    wb.created = new Date();

    const months = [];
    for(let m=1;m<=12;m++){ months.push(year+"-"+String(m).padStart(2,"0")); }

    const cashWs = wb.addWorksheet("Cash Flow", { views:[{state:'frozen', ySplit:4}] });
    const refs = [];

    months.forEach(mk=>{
      const mt = monthTotals(mk);
      const list = mt.list.slice();
      if(mt.incomeVal > 0){
        list.push({date: mk+"-01", type:"income", category:"Monthly income", amount: mt.incomeVal,
          note: mt.inherited ? `carried from ${monthLabelText(mt.sourceMonth)}` : ""});
      }
      list.sort((a,b)=> a.date.localeCompare(b.date));

      const label = shortMonthLabel(mk);
      const ws = wb.addWorksheet(label, { views:[{state:'frozen', ySplit:4}] });
      ws.columns = [{width:13},{width:11},{width:24},{width:15},{width:34}];

      ws.mergeCells('A1:E1');
      const title = ws.getCell('A1');
      title.value = `Personal Finance Ledger — ${monthLabelText(mk)}`;
      title.font = {bold:true, size:14, color:{argb:PAL.paper.argb}};
      title.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
      title.alignment = {vertical:'middle'};
      ws.getRow(1).height = 26;

      ws.mergeCells('A2:E2');
      ws.getCell('A2').value = `Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}  ·  ${list.length} transaction${list.length===1?'':'s'}`;
      ws.getCell('A2').font = {italic:true, size:10, color:{argb:PAL.soft.argb}};
      ws.getRow(2).height = 18;
      ws.getRow(3).height = 6;

      const head = ws.getRow(4);
      head.values = ['Date','Type','Category',`Amount (${CCY})`,'Note'];
      head.eachCell(c=>{
        c.font = {bold:true, color:{argb:PAL.paper.argb}};
        c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
      });
      head.height = 20;
      ws.autoFilter = { from:'A4', to:'E4' };

      const dataStart = 5;
      let r = dataStart;
      if(list.length){
        list.forEach((t,i)=>{
          const row = ws.getRow(r);
          row.values = [t.date, t.type==='income'?'Income':'Expense', t.category, t.amount, t.note||''];
          row.getCell(4).numFmt = '#,##0.00';
          const color = t.type==='income' ? PAL.green.argb : PAL.rust.argb;
          row.getCell(2).font = {bold:true, color:{argb:color}};
          row.getCell(4).font = {bold:true, color:{argb:color}};
          if(i%2===1){ row.eachCell({includeEmpty:true}, c=>{ c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.stripe.argb}}; }); }
          row.eachCell({includeEmpty:true}, c=>{ c.border = {bottom:{style:'hair', color:{argb:PAL.line.argb}}}; });
          r++;
        });
      } else { r++; }
      const dataEnd = r-1;
      r++;

      const incomeRow = r;
      ws.mergeCells(`A${r}:C${r}`);
      ws.getCell(`A${r}`).value = 'Total income'; ws.getCell(`A${r}`).font = {bold:true};
      ws.getCell(`D${r}`).value = { formula: `SUMIF(B${dataStart}:B${dataEnd},"Income",D${dataStart}:D${dataEnd})`, result: mt.inc };
      ws.getCell(`D${r}`).numFmt = '#,##0.00';
      ws.getCell(`D${r}`).font = {bold:true, color:{argb:PAL.green.argb}};
      r++;

      const expenseRow = r;
      ws.mergeCells(`A${r}:C${r}`);
      ws.getCell(`A${r}`).value = 'Total spent'; ws.getCell(`A${r}`).font = {bold:true};
      ws.getCell(`D${r}`).value = { formula: `SUMIF(B${dataStart}:B${dataEnd},"Expense",D${dataStart}:D${dataEnd})`, result: mt.exp };
      ws.getCell(`D${r}`).numFmt = '#,##0.00';
      ws.getCell(`D${r}`).font = {bold:true, color:{argb:PAL.rust.argb}};
      r++;

      ws.mergeCells(`A${r}:C${r}`);
      ws.getCell(`A${r}`).value = 'Net'; ws.getCell(`A${r}`).font = {bold:true};
      ws.getCell(`D${r}`).value = { formula: `D${incomeRow}-D${expenseRow}`, result: mt.net };
      ws.getCell(`D${r}`).numFmt = '#,##0.00';
      ws.getCell(`D${r}`).font = {bold:true};

      refs.push({ label, incomeRef: `'${label}'!D${incomeRow}`, expenseRef: `'${label}'!D${expenseRow}`, inc: mt.inc, exp: mt.exp });
    });

    cashWs.columns = [{width:12},{width:16},{width:16},{width:16},{width:20},{width:18}];
    cashWs.mergeCells('A1:F1');
    const cfTitle = cashWs.getCell('A1');
    cfTitle.value = `Annual Cash Flow — ${year}`;
    cfTitle.font = {bold:true, size:14, color:{argb:PAL.paper.argb}};
    cfTitle.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
    cfTitle.alignment = {vertical:'middle'};
    cashWs.getRow(1).height = 26;

    cashWs.mergeCells('A2:F2');
    cashWs.getCell('A2').value = `Generated ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})} · by HESHAM MOHAMED`;
    cashWs.getCell('A2').font = {italic:true, size:10, color:{argb:PAL.soft.argb}};
    cashWs.getRow(2).height = 18;
    cashWs.getRow(3).height = 6;

    const cfHead = cashWs.getRow(4);
    cfHead.values = ['Month', `Income `, `Expenses `, `Net `, `Cumulative`, 'Expenses'];
    cfHead.eachCell(c=>{
      c.font = {bold:true, color:{argb:PAL.paper.argb}};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.ink.argb}};
    });
    cfHead.height = 20;

    let cr = 5;
    let running = 0;
    refs.forEach((ref, i)=>{
      const row = cashWs.getRow(cr);
      const net = ref.inc - ref.exp;
      running += net;
      row.getCell(1).value = ref.label;
      row.getCell(2).value = { formula: ref.incomeRef, result: ref.inc };
      row.getCell(3).value = { formula: ref.expenseRef, result: ref.exp };
      row.getCell(4).value = { formula: `B${cr}-C${cr}`, result: net };
      row.getCell(5).value = i===0 ? { formula: `D${cr}`, result: running } : { formula: `E${cr-1}+D${cr}`, result: running };
      row.getCell(6).value = { formula: `-C${cr}`, result: -ref.exp };
      [2,3,4,5,6].forEach(col=> row.getCell(col).numFmt = '#,##0.00');
      row.getCell(4).font = {bold:true};
      row.getCell(6).font = {color:{argb:PAL.soft.argb}};
      if(i%2===1){ row.eachCell({includeEmpty:true}, c=>{ c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:PAL.stripe.argb}}; }); }
      row.eachCell({includeEmpty:true}, c=>{ c.border = {bottom:{style:'hair', color:{argb:PAL.line.argb}}}; });
      cr++;
    });

    const lastDataRow = cr-1;
    const totalInc = refs.reduce((s,x)=> s+x.inc, 0);
    const totalExp = refs.reduce((s,x)=> s+x.exp, 0);
    cr++;
    cashWs.getCell(`A${cr}`).value = 'Year total'; cashWs.getCell(`A${cr}`).font = {bold:true};
    cashWs.getCell(`B${cr}`).value = { formula: `SUM(B5:B${lastDataRow})`, result: totalInc };
    cashWs.getCell(`C${cr}`).value = { formula: `SUM(C5:C${lastDataRow})`, result: totalExp };
    cashWs.getCell(`D${cr}`).value = { formula: `SUM(D5:D${lastDataRow})`, result: totalInc-totalExp };
    cashWs.getCell(`E${cr}`).value = { formula: `E${lastDataRow}`, result: running };
    ['B','C','D','E'].forEach(col=>{
      cashWs.getCell(`${col}${cr}`).numFmt = '#,##0.00';
      cashWs.getCell(`${col}${cr}`).font = {bold:true};
    });
    cashWs.getRow(cr).eachCell({includeEmpty:true}, c=>{ c.border = {top:{style:'thin', color:{argb:PAL.ink.argb}}}; });
    cashWs.autoFilter = { from:'A4', to:'E4' };

    const cfChart = {
      sheet: 'Cash Flow',
      xml: cashFlowChartXml('Cash Flow', {
        titleText: `Annual Cash Flow — ${year}`,
        catRange: `$A$5:$A$${lastDataRow}`,
        incomeRange: `$B$5:$B$${lastDataRow}`,
        expenseRange: `$F$5:$F$${lastDataRow}`,
        cumRange: `$E$5:$E$${lastDataRow}`,
        incomeHead: '$B$4', expenseHead: '$C$4', cumHead: '$E$4',
        incomeName: `Income `, expenseName: `Expenses `, cumName: `Cumulative `,
        ccy: CCY
      }),
      anchor: {fromCol:0, fromRow:cr+2, toCol:9, toRow:cr+26}
    };

    const buf = await wb.xlsx.writeBuffer();
    const bytes = await injectCharts(buf, [cfChart]);
    const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    await saveFile(`ledger-${year}-annual.xlsx`, blob);
  }

  document.getElementById("expExcel").onclick = ()=> exportExcel(viewingMonth);
  document.getElementById("expPdf").onclick = ()=> exportPdf(viewingMonth);
  document.getElementById("expYear").onclick = ()=> exportAnnualExcel(viewingMonth.split("-")[0]);

  // ---- Backup / Restore (JSON file) ----
  document.getElementById("bkSave").onclick = async ()=>{
    const payload = { app:"personal-finance-ledger", version:1, exportedAt:new Date().toISOString(), data:data };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    await saveFile("finance-backup-"+todayISO()+".json", blob);
  };
  document.getElementById("bkLoad").onclick = ()=> document.getElementById("bkFile").click();
  document.getElementById("bkFile").onchange = async (ev)=>{
    const input = ev.target;
    const file = input.files && input.files[0];
    input.value = "";
    if(!file) return;
    try{
      const parsed = JSON.parse(await file.text());
      const d = (parsed && parsed.data) ? parsed.data : parsed;
      if(!d || !Array.isArray(d.transactions)) throw new Error("Not a valid backup file");
      if(!d.archivedMonths) d.archivedMonths = {};
      if(!d.monthlyIncome) d.monthlyIncome = {};
      if(!d.customCategories) d.customCategories = {};
      if(!d.customCategories.expense) d.customCategories.expense = [];
      if(!d.customCategories.income) d.customCategories.income = [];
      if(!d.lastSeenMonth) d.lastSeenMonth = monthKey(new Date());
      if(!confirm("Restore this backup?\n\n"+d.transactions.length+" transactions will be loaded and will REPLACE the data currently in this browser.")) return;
      data = d;
      await saveData();
      populateCategorySelect();
      checkRollover();
      render(false);
      alert("Backup restored successfully.");
    }catch(e){
      alert("Could not restore: "+(e && e.message ? e.message : "invalid file"));
    }
  };

  (async function init(){
    data = await loadData();
    populateCategorySelect();
    checkRollover();
    render(false);
  })();
})();
</script>
